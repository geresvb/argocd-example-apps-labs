apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: alpine:latest
          command:
            - "sh"
            - "-c"
            - |
              echo 'Installing curl...'
              apk add --no-cache curl

              echo 'Running db migration...'
              curl -i -X POST 'https://test-api.free.beeceptor.com' \
                -H 'Content-Type: application/json' \
                -d '{"message":"Database migration in progress"}'

              sleep 10
              echo 'Done!'
